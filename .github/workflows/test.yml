name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Engine tests (system Python)
        run: make test
      - name: Engine tests (bundled runtime)
        run: make test-bundled
      - name: Build universal app
        run: make app
      - name: Check both architectures
        env:
          APP: app/Pr26 Downgrader.app
        run: |
          lipo -archs "$APP/Contents/MacOS/Pr26Downgrader"
          lipo -archs "$APP/Contents/Resources/python/bin/python3.12"
          arch -x86_64 "$APP/Contents/Resources/python/bin/python3" -I -B \
            "$APP/Contents/Resources/prproj_downgrade.py" --version
